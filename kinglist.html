<!DOCTYPE html>
<html>
<head>
  <title>Kings</title>
  <style>
    table, th, td { border: 1px solid  var(--text-color); border-collapse: collapse; padding: 8px; }
    /* Style the tab */
    .tab {
      overflow: hidden;
      border: 1px solid #ccc;
      background-color: #f1f1f1;
    }
    
    /* Style the buttons that are used to open the tab content */
    .tab button {
      background-color: inherit;
      float: left;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 14px 16px;
      transition: 0.3s;
	  color: #333333;
    }
    
    /* Change background color of buttons on hover */
    .tab button:hover {
      background-color: #ddd;
    }
    
    /* Create an active/current tablink class */
    .tab button.active {
      background-color: #ccc;
    }
    
    /* Style the tab content */
    .tabcontent {
      display: none;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-top: none;
    }
	:root {
	  /* Tells the browser that the site supports both modes */
	  color-scheme: light dark; 

	  /* Syntax: light-dark(light-value, dark-value) */
	  --bg-color: light-dark(#ffffff, #121212);
	  --text-color: light-dark(#333333, #f5f5f5);
	}

	body {
	  background-color: var(--bg-color);
	  color: var(--text-color);
	}
  </style>
</head>
<body>

  <!-- Tab links -->
  <div class="tab">
    <button class="tablinks" onclick="openList(event, 'Rounds')" id="defaultOpen">Rounds</button>
    <button class="tablinks" onclick="openList(event, 'Dispute')">Gentlemen's Dispute</button>
    <button class="tablinks" onclick="openList(event, 'Chicken')">Chicken</button>
  </div>
  
  <!-- Tab content -->
  <div id="Rounds" class="tabcontent">
    <h1>Rounds</h1>
	<h2>Current King: <span id="roundsKing"></span></h2>
	<h4>Current Streak: <span id="roundsStreak"></span></h4>
    <table id="roundsTable">
      <thead>
        <tr><th>King</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  
  <div id="Dispute" class="tabcontent">
    <h1>Gentlemen's Dispute</h1>
	<h2>Current King: <span id="disputeKing"></span></h2>
	<h4>Current Streak: <span id="disputeStreak"></span></h4>
    <table id="disputeTable">
      <thead>
        <tr><th>King</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  
  <div id="Chicken" class="tabcontent">
    <h1>Chicken</h1>
	<h2>Current King: <span id="chickenKing"></span></h2>
	<h4>Current Streak: <span id="chickenStreak"></span></h4>
    <table id="chickenTable">
      <thead>
        <tr><th>King</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const data = {
      rounds: [
        { name: "Plato360", date: "2026-08-20" },
        { name: "TekTao", date: "" }
      ],
      dispute: [
        { name: "KoChan03", date: "2026-08-30" },
        { name: "Plato360", date: "2026-08-29" },
        { name: "Plato360", date: "2026-08-26" },
        { name: "TekTao", date: "" }
      ],
      chicken: [
      ]
    };
	
	function openList(evt, listName) {
	  // Declare all variables
	  var i, tabcontent, tablinks;

	  // Get all elements with class="tabcontent" and hide them
	  tabcontent = document.getElementsByClassName("tabcontent");
	  for (i = 0; i < tabcontent.length; i++) {
		tabcontent[i].style.display = "none";
	  }

	  // Get all elements with class="tablinks" and remove the class "active"
	  tablinks = document.getElementsByClassName("tablinks");
	  for (i = 0; i < tablinks.length; i++) {
		tablinks[i].className = tablinks[i].className.replace(" active", "");
	  }

	  // Show the current tab, and add an "active" class to the button that opened the tab
	  document.getElementById(listName).style.display = "block";
	  evt.currentTarget.className += " active";
	}
	
	function getCurrentStreakDetails(gameData) {
	  if (gameData == null || gameData.length == 0) {
	    return 'None';
	  }
	  const king = gameData[0].name;
	  let startDate = gameData[0].date;
	  let count = 1;
	  
	  for (let i = 1; i < gameData.length; i++) {
	    if (king === gameData[i].name){
		  startDate = gameData[i].date;
		  count = count + 1;
		} else {
		  break;
		}
	  }
	  
	  let daysSince = -1;
	  if (startDate.length > 0) {	  
		  const pastDate = new Date(startDate+"T12:00:00-04:00");
		  const today = new Date();
		  
		  const timeDiff = today - pastDate; 
		  // Convert milliseconds into days
		  daysSince = Math.floor(timeDiff / (1000 * 60 * 60 * 24)); 
	  }
	  
	  return `${count} win${count > 1 ? 's' : ''}, ${daysSince < 0 ? 'unknown days' : (daysSince > 1 ? daysSince+' days' : '1 day')}`;
	}

    const roundstbody = document.querySelector("#roundsTable tbody");
    data["rounds"].forEach(item => {
      roundstbody.innerHTML += `<tr><td>${item.name}</td><td>${item.date}</td></tr>`;
    });
    const disputetbody = document.querySelector("#disputeTable tbody");
    data["dispute"].forEach(item => {
      disputetbody.innerHTML += `<tr><td>${item.name}</td><td>${item.date}</td></tr>`;
    });
    const chickentbody = document.querySelector("#chickenTable tbody");
    data["chicken"].forEach(item => {
      chickentbody.innerHTML += `<tr><td>${item.name}</td><td>${item.date}</td></tr>`;
    });
	
	if (data["rounds"].length > 0) {
	  document.getElementById("roundsKing").innerHTML=data["rounds"][0].name
	  document.getElementById("roundsStreak").innerHTML=getCurrentStreakDetails(data["rounds"])
	}
	if (data["dispute"].length > 0) {
	  document.getElementById("disputeKing").innerHTML=data["dispute"][0].name
	  document.getElementById("disputeStreak").innerHTML=getCurrentStreakDetails(data["dispute"])
	}
	if (data["chicken"].length > 0) {
	  document.getElementById("chickenKing").innerHTML=data["chicken"][0].name
	  document.getElementById("chickenStreak").innerHTML=getCurrentStreakDetails(data["chicken"])
	}
	document.getElementById("defaultOpen").click();
  </script>

</body>
</html>
