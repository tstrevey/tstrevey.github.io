<!DOCTYPE html>
<html>
<head>
  <title>Kings</title>
  <style>
    table, th, td { border: 1px solid black; border-collapse: collapse; padding: 8px; }
    /* Style the tab */
    .tab {
      overflow: hidden;
      border: 1px solid #ccc;
      background-color: #f1f1f1;
    }
    
    /* Style the buttons that are used to open the tab content */
    .tab button {
      background-color: inherit;
      float: left;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 14px 16px;
      transition: 0.3s;
    }
    
    /* Change background color of buttons on hover */
    .tab button:hover {
      background-color: #ddd;
    }
    
    /* Create an active/current tablink class */
    .tab button.active {
      background-color: #ccc;
    }
    
    /* Style the tab content */
    .tabcontent {
      display: none;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-top: none;
    }
  </style>
</head>
<body>

  <!-- Tab links -->
  <div class="tab">
    <button class="tablinks" onclick="openList(event, 'Rounds')" id="defaultOpen">Rounds</button>
    <button class="tablinks" onclick="openList(event, 'Dispute')">Gentlemen's Dispute</button>
    <button class="tablinks" onclick="openList(event, 'Chicken')">Chicken</button>
  </div>
  
  <!-- Tab content -->
  <div id="Rounds" class="tabcontent">
    <h3>Rounds</h3>
	<p>Current King: <span id="roundsKing"></span></p>
    <table id="roundsTable">
      <thead>
        <tr><th>King</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  
  <div id="Dispute" class="tabcontent">
    <h3>Gentlemen's Dispute</h3>
	<p>Current King: <span id="disputeKing"></span></p>
    <table id="disputeTable">
      <thead>
        <tr><th>King</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  
  <div id="Chicken" class="tabcontent">
    <h3>Chicken</h3>
	<p>Current King: <span id="chickenKing"></span></p>
    <table id="chickenTable">
      <thead>
        <tr><th>King</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const data = {
      rounds: [
        { name: "Plato360", date: "2026-08-20" },
        { name: "Plato360", date: "2026-08-15" },
        { name: "TekTao", date: "" }
      ],
      dispute: [
        { name: "TekTao", date: "" }
      ],
      chicken: [
      ]
    };
	
	function openList(evt, listName) {
	  // Declare all variables
	  var i, tabcontent, tablinks;

	  // Get all elements with class="tabcontent" and hide them
	  tabcontent = document.getElementsByClassName("tabcontent");
	  for (i = 0; i < tabcontent.length; i++) {
		tabcontent[i].style.display = "none";
	  }

	  // Get all elements with class="tablinks" and remove the class "active"
	  tablinks = document.getElementsByClassName("tablinks");
	  for (i = 0; i < tablinks.length; i++) {
		tablinks[i].className = tablinks[i].className.replace(" active", "");
	  }

	  // Show the current tab, and add an "active" class to the button that opened the tab
	  document.getElementById(listName).style.display = "block";
	  evt.currentTarget.className += " active";
	}
	
	function getCurrentReignDetails(gameData) {
	  const king = gameData[0].name;
	  let startDate = gameData[0].date;
	  let count = 1;
	  
	  for (let i = 1; i < gameData.length; i++) {
	    if (king === gameData[i].name){
		  startDate = gameData[i].date;
		  count = count + 1;
		} else {
		  break;
		}
	  }
	  
	  const pastDate = new Date(startDate);
	  const today = new Date();
	  
	  const timeDiff = today - pastDate; 
	  // Convert milliseconds into days
	  const daysSince = Math.floor(timeDiff / (1000 * 60 * 60 * 24)); 
	  
	  return `${king} (${count} wins, ${daysSince} days)`;
	}

    const roundstbody = document.querySelector("#roundsTable tbody");
    data["rounds"].forEach(item => {
      roundstbody.innerHTML += `<tr><td>${item.name}</td><td>${item.date}</td></tr>`;
    });
    const disputetbody = document.querySelector("#disputeTable tbody");
    data["dispute"].forEach(item => {
      disputetbody.innerHTML += `<tr><td>${item.name}</td><td>${item.date}</td></tr>`;
    });
    const chickentbody = document.querySelector("#chickenTable tbody");
    data["chicken"].forEach(item => {
      chickentbody.innerHTML += `<tr><td>${item.name}</td><td>${item.date}</td></tr>`;
    });
	
	if (data["rounds"].length > 0) {
	  document.getElementById("roundsKing").innerHTML=getCurrentReignDetails(data["rounds"])
	}
	if (data["dispute"].length > 0) {
	  document.getElementById("disputeKing").innerHTML=getCurrentReignDetails(data["dispute"])
	}
	if (data["chicken"].length > 0) {
	  document.getElementById("chickenKing").innerHTML=getCurrentReignDetails(data["chicken"])
	}
	document.getElementById("defaultOpen").click();
  </script>

</body>
</html>
